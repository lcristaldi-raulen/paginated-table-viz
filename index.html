      if (cfg.headerAlign === 'left' || cfg.headerAlign === 'right' || cfg.headerAlign === 'center') {
        return cfg.headerAlign;
      }
      return pdfAligns[c.fieldName] || (c.isNumeric ? 'right' : 'left');
    }

    // ---- header rows (two lines when date labels are appended) ----
    // Rebuilt per pass because every font size in here is multiplied by the
    // fit-to-width scale worked out from the measurement pass.
    var pdfRuns = bandRuns();
    var pdfWantBandRow = cfg.showHeaderBands && pdfRuns.some(runHasContent);

    function buildHeadRows(scale) {
      function labelCell(c, spans) {
        var st = {
          halign: headAlignFor(c),
          valign: spans && cfg.spanHeaderTop ? 'top' : pdfVAlign(cfg.headerVAlign),
          fontStyle: headBold
        };
        if (pdfSizes[c.fieldName]) {
          st.fontSize = pdfScaled(pdfSizes[c.fieldName], cfg.headSize, headPt) * scale;
        }
        var cell = {
          content: c.hideHeader ? '' : (c.sublabel ? c.label + '\n' + c.sublabel : c.label),
          styles: st
        };
        if (spans) cell.rowSpan = 2;
        return cell;
      }

      if (!pdfWantBandRow) {
        var flat = tableCols.map(function (c) { return labelCell(c, false); });
        if (cfg.showRowNumbers) {
          flat.unshift({ content: '#', styles: { halign: 'right', valign: pdfVAlign(cfg.headerVAlign) } });
        }
        return [flat];
      }

      // Two tiers. A run with no band name gives each of its columns a cell that
      // spans both tiers, exactly as the on-screen table does — otherwise those
      // columns carry a strip of empty grey above a heading stranded halfway
      // down the block.
      var bandPt = pdfScaled(cfg.bandFontSize, cfg.headSize, headPt) * scale;
      var bandRowCells = [];
      var labelRowCells = [];

      if (cfg.showRowNumbers) {
        if (cfg.bandSpanUnbanded) {
          bandRowCells.push({
            content: '#', rowSpan: 2,
            styles: { halign: 'right', valign: cfg.spanHeaderTop ? 'top' : pdfVAlign(cfg.headerVAlign) }
          });
        } else {
          bandRowCells.push({ content: '', styles: { fillColor: hexToRgb(cfg.headBg) } });
          labelRowCells.push({ content: '#', styles: { halign: 'right', valign: pdfVAlign(cfg.headerVAlign) } });
        }
      }

      var at = 0;
      pdfRuns.forEach(function (r) {
        if (runHasContent(r) || !cfg.bandSpanUnbanded) {
          var text = bandText(r);
          if (r.range && r.label && cfg.bandDateStyle !== 'inline') text += '\n' + r.range;
          bandRowCells.push({
            content: text,
            colSpan: r.count,
            styles: {
              halign: cfg.bandAlign === 'left' ? 'left' : (cfg.bandAlign === 'right' ? 'right' : 'center'),
              valign: pdfVAlign(cfg.bandVAlign),
              fontSize: bandPt,
              // The extra 0.375pt each side is the 1px the band row gets on
              // screen, converted at the usual 0.75.
              cellPadding: {
                top: (headPadY + 0.375) * scale, bottom: (headPadY + 0.375) * scale,
                left: padX * scale, right: padX * scale
              },
              fillColor: hexToRgb(runHasContent(r) ? cfg.bandBg : cfg.headBg),
              textColor: hexToRgb(cfg.bandText),
              fontStyle: 'bold'
            }
          });
          for (var k = 0; k < r.count; k++) labelRowCells.push(labelCell(tableCols[at + k], false));
        } else {
          for (var j = 0; j < r.count; j++) bandRowCells.push(labelCell(tableCols[at + j], true));
        }
        at += r.count;
      });

      return [bandRowCells, labelRowCells];
    }

    // ---- body, with group bands as full-width spanning rows ----
    var groupCounts = null;
    if (groupField && cfg.showGroupCounts) {
      groupCounts = {};
      filtered.forEach(function (r) {
        var k = displayOf(r, groupField);
        groupCounts[k] = (groupCounts[k] || 0) + 1;
      });
    }

    var groupStyles = [];  // style objects of the group rows, rescaled per pass
    var bodyCells = [];    // every data cell, for the max-lines clamp
    // Both are reset and refilled once the pages are known — see packPages().
    var headColCount = tableCols.length + (cfg.showRowNumbers ? 1 : 0);

    function dataRow(r, i) {
      var row = [];
      if (cfg.showRowNumbers) row.push({ content: String(i + 1), styles: {} });
      tableCols.forEach(function (c) {
        var txt = displayOf(r, c.fieldName);
        var fmt = cellFormat(c, cellOf(r, c.fieldName), txt, r);
        var st = {};
        if (fmt) {
          if (fmt.weight === 'bold') st.fontStyle = fmt.italic === 'italic' ? 'bolditalic' : 'bold';
          else if (fmt.italic === 'italic') st.fontStyle = 'italic';
          else if (fmt.weight === 'normal' || fmt.italic === 'normal') st.fontStyle = 'normal';
          if (fmt.color) st.textColor = hexToRgb(fmt.color);
          if (fmt.bg) st.fillColor = hexToRgb(fmt.bg);
        }
        row.push({ content: txt, styles: st });
      });
      bodyCells.push(row);
      return row;
    }

    function groupRow(label) {
      var gst = {
        fillColor: hexToRgb(cfg.groupBg),
        textColor: hexToRgb(cfg.groupText),
        fontStyle: 'bold',
        fontSize: pdfScaled(cfg.groupFontSize, cfg.bodySize, bodyPt),
        halign: 'left'
      };
      groupStyles.push(gst);
      return [{ content: label, colSpan: headColCount, styles: gst }];
    }

    function groupLabel(r, continued) {
      var gv = displayOf(r, groupField);
      var label = (cfg.groupPrefix || '') + gv;
      if (groupCounts) label += '  (' + groupCounts[gv] + ')';
      if (continued) label += '  ·  continued';
      return label;
    }

    /* Build one page's worth of rows, mirroring the on-screen page exactly:
       N data rows, a band whenever the group changes, and — when the setting is
       on — the band repeated at the top of a page that carries a group over.
       `slice` is the data rows; `startIdx` is where they sit in `filtered`. */
    function buildBody(slice, startIdx, repeatCarriedBand) {
      var out = [];
      var meta = [];        // per emitted row: {group, isBand}
      var lastG = null;
      var carried = false;
      if (groupField && startIdx > 0 && slice.length) {
        carried = displayOf(filtered[startIdx - 1], groupField) === displayOf(slice[0], groupField);
      }
      var wantCarriedBand = carried && cfg.repeatGroupHeader && repeatCarriedBand !== false;
      slice.forEach(function (r, i) {
        if (groupField && cfg.pdfIncludeGroups) {
          var gv = displayOf(r, groupField);
          // The first row of a page continues the previous page's group, so its
          // band is a repeat: emit it only if there is room. Every other change
          // of group opens a new band as usual.
          var wantBand = (i === 0 && carried) ? wantCarriedBand : gv !== lastG;
          if (wantBand) {
            var label = groupLabel(r, i === 0 && carried);
            out.push(groupRow(label));
            meta.push({ group: label, isBand: true });
          }
          lastG = gv;
        }
        out.push(dataRow(r, startIdx + i));
        meta.push({
          group: groupField ? (cfg.groupPrefix || '') + displayOf(r, groupField) : null,
          isBand: false
        });
      });
      return { body: out, meta: meta };
    }

    var matchMode = cfg.pdfRowsMode === 'match';

    /* The probe lays every row out in one continuous table. That gives the
       column widths all pages will share — measuring a single page's worth would
       let page 2 drift from page 1 — and the height of each individual row,
       which is what the page packing below needs. */
    var continuous = buildBody(filtered, 0);
    var probeBody = continuous.body;

    // Filled in after the probe: rows to put on each page.
    var chunks = [];

    // Row padding is a pixel setting on screen; halved it lands on the old
    // default of 2pt at the default 4px, so existing PDFs are unchanged.
    var padY = Math.max(0.5, cfg.rowPad * 0.5);
    var padX = padY;
    var headPadY = Math.max(1, cfg.rowPad);

    var offset = cfg.showRowNumbers ? 1 : 0;
    var pdfWidths = columnWidths();
    // Off, the screen truncates unsized columns with an ellipsis rather than
    // wrapping them; the PDF follows suit. Sized columns always wrap, both here
    // and on screen, because that is the point of giving one a width.
    var autoOverflow = cfg.wrapText ? 'linebreak' : 'ellipsize';

    // `pin` is the measured width of every column from the probe pass. It is
    // supplied only once the body text has been clamped to a line limit, so the
    // clamp and the final layout are computed against the same widths.
    function buildColStyles(scale, pin) {
      var colStyles = {};
      if (cfg.showRowNumbers) colStyles[0] = { halign: 'right', cellWidth: 22 * scale };
      tableCols.forEach(function (c, i) {
        var st = {};
        // Explicit alignment wins over the numbers-right default, same as on screen.
        st.halign = pdfAligns[c.fieldName] || (c.isNumeric ? 'right' : 'left');
        // px -> pt so on-screen widths carry across at roughly the same ratio.
        if (pdfWidths[c.fieldName]) {
          st.cellWidth = pdfWidths[c.fieldName] * 0.75 * scale;
          st.overflow = 'linebreak';
        } else {
          st.overflow = autoOverflow;
        }
        // Min column width is deliberately NOT carried over: the screen can scroll
        // sideways, a page cannot, and a floor of 70px across 20+ columns would
        // push the table off the paper.
        if (pdfSizes[c.fieldName]) {
          st.fontSize = pdfScaled(pdfSizes[c.fieldName], cfg.bodySize, bodyPt) * scale;
        }
        if (pin && pin[i + offset]) st.cellWidth = pin[i + offset];
        colStyles[i + offset] = st;
      });
      return colStyles;
    }

    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var pdfDividers = dividerIndices();

    var subtitleBits = [];
    if (anchorDate && cfg.dateHeaders) subtitleBits.push('Through ' + fmtDate(anchorDate, 'mm/dd/yy'));
    if (searchTerm.trim()) subtitleBits.push('Filter: \u201c' + searchTerm.trim() + '\u201d');
    if (cfg.pdfShowRowCount) {
      // "368 rows" is only right when the rows are rows. A schedule counts homes,
      // a punch list counts items, so the noun is the user's to set.
      var one = cfg.pdfRowWord === undefined ? 'row' : String(cfg.pdfRowWord).trim();
      var many = cfg.pdfRowWordPlural === undefined ? 'rows' : String(cfg.pdfRowWordPlural).trim();
      var word = filtered.length === 1 ? one : many;
      subtitleBits.push(filtered.length + (word ? ' ' + word : ''));
    }
    if (String(cfg.pdfNote || '').trim()) subtitleBits.push(String(cfg.pdfNote).trim());
    var subtitle = subtitleBits.join('  \u00b7  ');

    /* One continuous rule per divider per page, drawn after the page's cells.
       Drawing it per cell instead left it broken wherever a row spanned the full
       width — every group band punched a hole in every divider, which is what
       made them look like they faded in and out. Filled rectangles on whole-point
       geometry: viewers snap thin marks to the device pixel grid, and identical
       geometry snaps identically, so no rule comes out lighter than another. */
    function drawDividers(g) {
      if (!g || !isFinite(g.top) || g.bottom <= g.top) return;
      var idxs = Object.keys(g.xs);
      if (!idxs.length) return;
      var rgb = hexToRgb(cfg.dividerColor);
      doc.saveGraphicsState();
      doc.setFillColor(rgb[0], rgb[1], rgb[2]);
      idxs.forEach(function (k) {
        // Centred on the column boundary exactly, not rounded to a whole point.
        // Rounding made every rule snap to the pixel grid the same way, but it
        // also let the rule sit up to half a point off the boundary it belongs
        // to — so it no longer lined up with the header separators and the band
        // edges above it, and the whole rule read as slightly out of true.
        // Sitting on the boundary matters more than matching pixel phase.
        doc.rect(g.xs[k] - dividerPt / 2, g.top, dividerPt, g.bottom - g.top, 'F');
      });
      doc.restoreGraphicsState();
    }

    function optionsFor(scale, silent, pin, chunk) {
      var meta = (chunk && chunk.meta) || [];
      var firstBodyRowByPage = {};
      var pageGeom = {};
      return {
      head: buildHeadRows(scale),
      body: (chunk && chunk.body) || probeBody,
      startY: margin + titleBand,
      margin: { top: margin + titleBand, right: margin, bottom: footReserve, left: margin },
      tableWidth: 'auto',
      // Never let a wrapped row be sliced by a page break. autoTable's default
      // prints as many lines as fit and continues the rest at the top of the
      // next page, which reads as an orphaned fragment under the repeated
      // header. 'avoid' moves the whole row down instead.
      rowPageBreak: 'avoid',
      theme: 'grid',
      styles: {
        font: pdfFont,
        fontSize: bodyPt * scale,
        fontStyle: bodyBold,
        cellPadding: padY * scale,
        overflow: 'linebreak',
        lineColor: hexToRgb(cfg.border),
        lineWidth: borderPt,
        textColor: hexToRgb(cfg.text)
      },
      headStyles: {
        fontSize: headPt * scale,
        fillColor: hexToRgb(cfg.headBg),
        textColor: hexToRgb(cfg.headText),
        fontStyle: headBold,
        valign: pdfVAlign(cfg.headerVAlign),
        // Headings need more air above and below than data rows do — a band
        // name wrapped onto three lines otherwise sits with its capitals a
        // hair off the rule above it and reads as clipped. The screen gives a
        // band cell twice the row padding; this matches that.
        cellPadding: {
          top: headPadY * scale, bottom: headPadY * scale,
          left: padX * scale, right: padX * scale
        },
        lineColor: hexToRgb(cfg.border),
        lineWidth: borderPt
      },
      alternateRowStyles: cfg.banding ? { fillColor: hexToRgb(cfg.band) } : { fillColor: false },
      columnStyles: buildColStyles(scale, pin),
      willDrawCell: function (data) {
        if (silent) return;
        /* Collect what the dividers need: the vertical extent of everything
           drawn on this page and, for each divider column, its left edge. Only
           cells that span a single column give the true boundary — a merged band
           reports the start of its whole span. */
        var g = pageGeom[data.pageNumber] ||
                (pageGeom[data.pageNumber] = { top: Infinity, bottom: -Infinity, xs: {} });
        if (data.cell.y < g.top) g.top = data.cell.y;
        var below = data.cell.y + data.cell.height;
        if (below > g.bottom) g.bottom = below;
        var idx = data.column.index - (cfg.showRowNumbers ? 1 : 0);
        if (pdfDividers[idx] && data.cell.colSpan === 1 && g.xs[idx] === undefined) {
          g.xs[idx] = data.cell.x;
        }
        if (data.section !== 'body') return;
        if (firstBodyRowByPage[data.pageNumber] === undefined) {
          firstBodyRowByPage[data.pageNumber] = data.row.index;
        }
      },
      didDrawPage: function (data) {
        if (silent) return;
        var physical = doc.getNumberOfPages();
        drawDividers(pageGeom[data.pageNumber]);
        // A page that opens partway through a group and did not get a repeated
        // band of its own is named in the header area instead.
        var firstIdx = firstBodyRowByPage[data.pageNumber];
        var noBandCarry = chunk && chunk.carriedWithoutBand && data.pageNumber === 1 && firstIdx === 0;
        if (firstIdx !== undefined && (firstIdx > 0 || noBandCarry) && meta[firstIdx] &&
            !meta[firstIdx].isBand && meta[firstIdx].group) {
          doc.setFont('helvetica', 'italic');
          doc.setFontSize(8);
          doc.setTextColor(110, 110, 110);
          doc.text(meta[firstIdx].group + '  ·  continued', pageW - margin,
                   margin + logoH + logoGap + 24, { align: 'right' });
        }
        drawPageHeader(physical);
      }
      };
    }

    // Logo and title block. Drawn from didDrawPage so it lands on every page
    // autoTable opens, including the extra ones a long chunk spills onto.
    function drawPageHeader(physicalPage) {
      var first = physicalPage === 1;
      if (logoH && (first || cfg.pdfImageRepeat)) {
        var lx = margin;
        if (cfg.pdfImageAlign === 'center') lx = (pageW - logoW) / 2;
        else if (cfg.pdfImageAlign === 'right') lx = pageW - margin - logoW;
        try {
          doc.addImage(logo, lx, margin, logoW, logoH);
        } catch (e) {
          // A corrupt or unsupported data URL must not sink the whole export.
        }
      }
      if (!first && !cfg.pdfRepeatTitle) return;
      var top = margin + logoH + logoGap;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      var tc = hexToRgb(cfg.text);
      doc.setTextColor(tc[0], tc[1], tc[2]);
      doc.text(title, margin, top + 12);
      if (subtitle) {
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.setTextColor(110, 110, 110);
        doc.text(subtitle, margin, top + 24);
      }
    }

    /* ---- fit the table to a single page width -------------------------
       autoTable spreads columns across the available width on its own, but a
       column can refuse to shrink past the widest unbreakable word (or past an
       explicit width), and once the sum of those floors exceeds the paper the
       table runs off the right edge. So: lay the table out once into a throwaway
       document, measure what it actually used, and if that overflows, redo it
       with every font size, padding and width multiplied by the shortfall.
       Widths scale linearly with type size, so one correction is exact. */
    var avail = pageW - 2 * margin;
    var scale = 1;
    var measuredCols = null;

    // autoTable's hard floor is the explicit width of a sized column and 10pt
    // for an auto one. When those floors already add up to less than the page,
    // the layout physically cannot overflow, so the measurement pass — which
    // costs a second full render — is skipped.
    var floorSum = cfg.showRowNumbers ? 22 : 0;
    tableCols.forEach(function (c) {
      floorSum += pdfWidths[c.fieldName] ? pdfWidths[c.fieldName] * 0.75 : 10;
    });
    var canOverflow = floorSum > avail;
    // More than one page means more than one autoTable call, and each would size
    // its own columns from its own rows. Measuring once and pinning the result is
    // what keeps every page's grid identical.
    var needMeasure = (cfg.pdfFitWidth && canOverflow) || cfg.maxLines > 0 || matchMode;
    var rowHeights = null;    // height of each data row, indexed like `filtered`
    var bandHeight = 0;       // height of a group band row
    var availH = 0;           // printable height for body rows, header excluded

    if (needMeasure) {
      var probe = newDoc();
      probe.autoTable(optionsFor(1, true));
      var pt = probe.lastAutoTable;
      if (pt && pt.columns && pt.columns.length) {
        var used = pt.columns.reduce(function (a, c) { return a + (c.width || 0); }, 0);
        measuredCols = pt.columns.map(function (c) { return c.width || 0; });
        if (cfg.pdfFitWidth && used > avail + 0.5) {
          // 0.995 keeps the last vertical rule inside the margin after rounding.
          scale = Math.max(0.2, (avail / used) * 0.995);
          measuredCols = measuredCols.map(function (w) { return w * scale; });
        }

        /* Deliberately no vertical auto-shrink. Scaling the type down to force a
           page's rows onto one sheet silently cancels the very size and padding
           changes the user just made — ask for more padding and you get smaller
           text at the same pitch. Instead the packing below simply puts fewer
           rows on a page. */
        if (pt.body && pt.body.length === continuous.meta.length) {
          rowHeights = [];
          continuous.meta.forEach(function (mt, i) {
            var h = pt.body[i].height || 0;
            if (mt.isBand) bandHeight = Math.max(bandHeight, h);
            else rowHeights.push(h);
          });
          /* How tall the repeated header block really is. autoTable's own
             getHeadHeight() adds up each head row's tallest cell, and a heading
             that spans both tiers reports its whole two-row height in the first
             of them — so with merged headers it comes back a full row too big,
             which quietly cost every page a row. Reading where the first body
             row actually landed sidesteps the double count. */
          var top = margin + titleBand;
          var headH = 0;
          if (pt.body.length && pt.body[0].cells) {
            var firstCells = pt.body[0].cells;
            for (var ck in firstCells) {
              if (firstCells[ck] && typeof firstCells[ck].y === 'number' && firstCells[ck].y > top) {
                headH = firstCells[ck].y - top;
                break;
              }
            }
          }
          if (!(headH > 0) && pt.getHeadHeight) headH = pt.getHeadHeight(pt.columns);
          availH = pageH - top - footReserve - headH;
        }
      }
    }

    /* ---- how many rows go on each page --------------------------------
       Every page carries exactly the number set on the Pages tab; only the last
       one carries the remainder. Nothing is averaged, capped or evened out — a
       run of pages with different counts is far more jarring than a short final
       page, so the count is fixed and the layout has to accommodate it. */
    var tightPages = 0;    // pages whose rows are taller than the sheet
    var droppedBands = 0;  // repeated group bands sacrificed to make room
    var rowsThatFit = 0;   // how many rows a sheet would actually take

    if (rowHeights && rowHeights.length && availH > 0) {
      // Typical rather than worst case: the median row height answers "how many
      // rows fit" more usefully than the tallest row in the report would.
      var sorted = rowHeights.slice().sort(function (a, b) { return a - b; });
      var median = sorted[Math.floor(sorted.length / 2)] || 0;
      if (median > 0) rowsThatFit = Math.max(1, Math.floor((availH - bandHeight) / median));
    }

    /* The measured heights are not used to reduce the count. They decide one
       thing only: whether the band repeated at the top of a carry-over page has
       to be given up. That band is a convenience, not data, and dropping it buys
       back a row's worth of height — which is usually the whole difference
       between the rows fitting and not. */
    function pageIsTight(from, len, withBand) {
      if (!rowHeights || availH <= 0) return false;
      var groups = groupField && cfg.pdfIncludeGroups;
      var t = withBand ? bandHeight : 0;
      for (var i = from; i < from + len; i++) {
        t += rowHeights[i] || 0;
        if (groups && (i === 0 || displayOf(filtered[i], groupField) !==
                                  displayOf(filtered[i - 1], groupField))) {
          t += bandHeight;
        }
      }
      return t > availH;
    }

    if (matchMode) {
      // Rebuild the bodies page by page. The arrays the group rescale and the
      // line clamp work over must describe the pages that actually get drawn,
      // not the continuous run used for measuring.
      groupStyles = [];
      bodyCells = [];
      var per = perPage();
      for (var at = 0; at < filtered.length; at += per) {
        var len = Math.min(per, filtered.length - at);
        var carries = groupField && cfg.pdfIncludeGroups && cfg.repeatGroupHeader && at > 0 &&
          displayOf(filtered[at - 1], groupField) === displayOf(filtered[at], groupField);
        var keepBand = true;
        if (carries && pageIsTight(at, len, true) && !pageIsTight(at, len, false)) {
          keepBand = false;
          droppedBands++;
        }
        if (pageIsTight(at, len, carries && keepBand)) tightPages++;
        var chunk = buildBody(filtered.slice(at, at + len), at, keepBand);
        chunk.carriedWithoutBand = carries && !keepBand;
        chunks.push(chunk);
      }
      if (!chunks.length) chunks.push(buildBody([], 0, true));
    } else {
      chunks.push(continuous);
    }

    if (scale !== 1) {
      groupStyles.forEach(function (st) { st.fontSize = st.fontSize * scale; });
    }

    /* ---- max wrapped lines --------------------------------------------
       autoTable fixes a row's height from its own line count, so clamping at
       draw time would leave the row tall and half-empty. The measurement pass
       has already told us each column's final width, so the text is cut to
       size up front and the row comes out the right height. */
    // Pinning is what stops each page from sizing its own columns from its own
    // rows, which would make every sheet's grid slightly different.
    var pinWidths = ((chunks.length > 1 || matchMode) && measuredCols) ? measuredCols : null;
    if (cfg.maxLines > 0 && measuredCols) {
      pinWidths = measuredCols;
      var clampPad = Math.max(0.5, cfg.rowPad * 0.5) * scale;
      var colStylesNow = buildColStyles(scale, null);
      bodyCells.forEach(function (row) {
        if (!row) return;                       // group band row
        row.forEach(function (cell, ci) {
          var text = String(cell.content == null ? '' : cell.content);
          if (!text) return;
          var w = (measuredCols[ci] || 0) - 2 * clampPad;
          if (w <= 2) return;
          var cs = colStylesNow[ci] || {};
          doc.setFont(pdfFont, cell.styles.fontStyle || bodyBold);
          doc.setFontSize(cell.styles.fontSize || cs.fontSize || bodyPt * scale);
          var lines = doc.splitTextToSize(text, w);
          if (lines.length <= cfg.maxLines) return;
          lines = lines.slice(0, cfg.maxLines);
          lines[lines.length - 1] = lines[lines.length - 1].replace(/\s+\S*$/, '') + '…';
          cell.content = lines.join('\n');
        });
      });
    }

    chunks.forEach(function (chunk, i) {
      if (i > 0) doc.addPage();
      doc.autoTable(optionsFor(scale, false, pinWidths, chunk));
    });

    // Footers need the final page count, so they are drawn after the table.
    var total = doc.getNumberOfPages();
    for (var pg = 1; pg <= total; pg++) {
      doc.setPage(pg);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(7.5);
      doc.setTextColor(130, 130, 130);
      if (cfg.pdfTimestamp) {
        doc.text(title + '  \u00b7  generated ' + new Date().toLocaleString(), margin, pageH - margin + 8);
      }
      if (cfg.pdfPageNumbers) {
        doc.text('Page ' + pg + ' of ' + total, pageW - margin, pageH - margin + 8, { align: 'right' });
      }
    }

    downloadBlob(doc.output('blob'), slug(title) + '-' + stamp() + '.pdf');
    var note = total + (total === 1 ? ' page' : ' pages') + ', ' + filtered.length + ' rows exported.';
    if (scale < 1) note += ' Scaled to ' + Math.round(scale * 100) + '% to fit the page width.';
    if (matchMode) {
      if (tightPages) {
        note += ' ' + perPage() + ' rows do not fit the sheet on ' + tightPages +
          (tightPages === 1 ? ' page' : ' pages') + ', so those run over.';
        if (rowsThatFit) note += ' About ' + rowsThatFit + ' fit at this font size and row padding.';
      }
      if (droppedBands) {
        note += ' The repeated group band was left off ' + droppedBands +
          (droppedBands === 1 ? ' page' : ' pages') + ' to keep the row count.';
      }
    }
    toast(note);
  }

  /* =====================================================================
     CSV export
     ===================================================================== */
  function exportCsv() {
    var cols = tableCols.slice();
    var lines = [];

    // Merged bands can't survive in CSV, so emit them as a leading row with the
    // label in the first cell of each run — what Excel users expect to see.
    var csvRuns = bandRuns();
    if (cfg.showHeaderBands && csvRuns.some(runHasContent)) {
      var bandLine = [];
      if (groupField) bandLine.push('');
      csvRuns.forEach(function (r) {
        var text = r.label;
        if (r.range) text = text ? text + ' (' + r.range + ')' : r.range;
        bandLine.push(csvCell(text));
        for (var k = 1; k < r.count; k++) bandLine.push('');
      });
      lines.push(bandLine.join(','));
    }

    var head = [];
    if (groupField) head.push(csvCell(groupField));
    cols.forEach(function (c) {
      if (c.hideHeader) { head.push(''); return; }
      head.push(csvCell(c.sublabel ? c.label + ' (' + c.sublabel + ')' : c.label));
    });
    lines.push(head.join(','));
    filtered.forEach(function (r) {
      var line = [];
      if (groupField) line.push(csvCell(displayOf(r, groupField)));
      cols.forEach(function (c) { line.push(csvCell(displayOf(r, c.fieldName))); });
      lines.push(line.join(','));
    });
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    var name = String(cfg.pdfTitle || '').trim() || sheetName || 'paginated-table';
    downloadBlob(blob, slug(name) + '-' + stamp() + '.csv');
  }

  function csvCell(v) {
    var s = String(v == null ? '' : v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  /* =====================================================================
     Tableau interaction
     ===================================================================== */
  function persist(key, value) {
    if (isDemo || !apiReady() || !tableau.extensions.settings) return;
    try {
      tableau.extensions.settings.set(key, String(value));
      tableau.extensions.settings.saveAsync();
    } catch (e) { /* read-only viewer, etc. */ }
  }

  function selectRowInTableau(row) {
    if (!worksheet || !worksheet.selectMarksByValueAsync) return;
    var sel = [];
    if (groupField) sel.push({ fieldName: groupField, value: [cellOf(row, groupField).value] });
    for (var i = 0; i < tableCols.length && sel.length < 3; i++) {
      var c = tableCols[i];
      if (c.isNumeric) continue;
      sel.push({ fieldName: c.fieldName, value: [cellOf(row, c.fieldName).value] });
    }
    if (!sel.length) return;
    try {
      worksheet.selectMarksByValueAsync(sel, tableau.SelectionUpdateType.Replace)
        .catch(function () { /* value not selectable — ignore */ });
    } catch (e) { /* ignore */ }
  }

  function openSettings() {
    var url = window.location.origin +
      window.location.pathname.replace(/[^\/]*$/, '') +
      'settings-dialog.html';

    // The dialog is a separate document with no access to the worksheet, so
    // pass it the current columns — that's what displayDialogAsync's payload
    // argument is for. It powers the per-column date-label picker.
    var payload = '';
    try {
      payload = JSON.stringify({
        columns: tableCols.map(function (c) {
          return { field: c.fieldName, label: c.label, isNumeric: !!c.isNumeric };
        }),
        anchor: anchorDate ? fmtDate(anchorDate, 'mm/dd/yy') : '',
        anchorSource: anchorSource
      });
    } catch (e) { payload = ''; }

    tableau.extensions.ui.displayDialogAsync(url, payload, { height: 720, width: 540 })
      .then(function () {
        loadSettings();
        applyFilterAndSort();
        render();
      })
      .catch(function () {
        loadSettings();
        applyFilterAndSort();
        render();
      });
  }

  async function refreshData() {
    try {
      rawRows = await getSummaryDataTable(worksheet);
      var encMap = await getEncodingMap(worksheet);
      buildTableCols(encMap);
      applyFilterAndSort();
      render();
    } catch (err) {
      showError(err);
    }
  }

  function showError(err) {
    el.bar.innerHTML = '';
    el.host.innerHTML = '<div class="pt-msg"><div class="pt-msg-inner">' +
      '<h2>Could not load the worksheet data</h2>' + esc(err && err.message ? err.message : err) +
      '</div></div>';
  }

  /* =====================================================================
     Demo mode (opened directly in a browser, outside Tableau)
     ===================================================================== */
  // Demo-mode only: let ?showRowNumbers=true&freezeCols=2&… preview settings
  // combinations in a plain browser without a Tableau connection.
  function applyUrlOverrides() {
    if (!window.location.search || typeof URLSearchParams === 'undefined') return;
    new URLSearchParams(window.location.search).forEach(function (v, k) {
      if (!(k in DEFAULTS)) return;
      var d = DEFAULTS[k];
      if (typeof d === 'boolean') cfg[k] = (v === 'true' || v === '1');
      else if (typeof d === 'number') { var n = parseFloat(v); if (!isNaN(n)) cfg[k] = n; }
      else cfg[k] = v;
    });
  }

  function loadDemoData(reason) {
    isDemo = true;
    demoReason = reason || '';
    applyUrlOverrides();
    var supers = ['A. Reyes', 'B. Okafor', 'C. Nguyen', 'D. Sokolov', 'E. Whitfield'];
    var plans = ['Ashford', 'Bramble', 'Cypress', 'Dunmore', 'Elmhurst', 'Fairview'];
    var villages = ['Northgate', 'Stonebridge', 'Willow Run'];
    var cols = ['Superintendent', 'Job | Plan', 'Cus', 'Location | Template', 'Duration',
      'Framing Start', 'CN Comp Date', 'CN Comp Days', 'FQI', 'Total Change',
      'Week 1', 'Week 2', 'Week 3', 'Week 4'];

    colMeta = {};
    cols.forEach(function (c) {
      var numeric = ['Duration', 'CN Comp Days', 'FQI', 'Total Change',
        'Week 1', 'Week 2', 'Week 3', 'Week 4'].indexOf(c) !== -1;
      var dated = ['Framing Start', 'CN Comp Date'].indexOf(c) !== -1;
      colMeta[c] = {
        dataType: numeric ? 'int' : (dated ? 'date' : 'string'),
        isNumeric: numeric,
        isDate: dated
      };
    });

    rawRows = [];
    var seed = 7;
    function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
    supers.forEach(function (sup, si) {
      var n = 14 + Math.floor(rnd() * 12);
      for (var i = 0; i < n; i++) {
        var row = {};
        var d = new Date(2026, 0, 5 + Math.floor(rnd() * 200));
        var mk = function (v, f) { return { value: v, formattedValue: f === undefined ? String(v) : f }; };
        row['Superintendent'] = mk(sup);
        row['Job | Plan'] = mk((3100 + si * 100 + i) + ' | ' + plans[Math.floor(rnd() * plans.length)]);
        row['Cus'] = mk(rnd() > 0.5 ? 'Y' : 'N');
        row['Location | Template'] = mk(villages[Math.floor(rnd() * villages.length)] + ' | Std-2');
        row['Duration'] = mk(90 + Math.floor(rnd() * 80));
        var comp = new Date(d.getFullYear(), d.getMonth() + 1, d.getDate(), 12);
        row['Framing Start'] = mk(d, fmtDate(d, 'mm/dd/yy'));
        row['CN Comp Date'] = mk(comp, fmtDate(comp, 'mm/dd/yy'));
        row['CN Comp Days'] = mk(Math.floor(rnd() * 40) - 10);
        var fqi = Math.floor(rnd() * 100);
        row['FQI'] = mk(fqi, fqi + '%');   // one draw: value and display must agree
        row['Total Change'] = mk(Math.floor(rnd() * 30) - 15);
        for (var w = 1; w <= 4; w++) row['Week ' + w] = mk(Math.floor(rnd() * 12) - 4);

        // Nulls in the three shapes Tableau actually delivers, so the preview
        // exercises all of them: a real null, the "%null%" literal, and the
        // empty string a string calculation produces.
        if (i % 7 === 3) row['CN Comp Date'] = { value: null, formattedValue: '' };
        if (i % 5 === 2) row['Total Change'] = { value: '%null%', formattedValue: '%null%' };
        if (i % 11 === 4) row['Location | Template'] = { value: '', formattedValue: '' };
        if (i % 4 === 1) row['Framing Start'] = { value: null, formattedValue: 'Null' };
        rawRows.push(row);
      }
    });

    tableCols = cols.slice(1).map(function (c) {
      return {
        fieldName: c, label: c, baseLabel: c, labelOverridden: false, hideHeader: false,
        sublabel: null, dateTitle: null, isNumeric: colMeta[c].isNumeric
      };
    });
    groupField = 'Superintendent';
    sheetName = 'Demo Table';
    applyHeaderOverrides();

    // No worksheet here, so loadAnchorDate resolves from dateAnchorFallback only.
    loadAnchorDate().then(function () {
      applyDateHeaders();
      applyFilterAndSort();
      render();
    });
  }

  /* =====================================================================
     Keyboard shortcuts
     ===================================================================== */
  document.addEventListener('keydown', function (e) {
    if (/^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName || ''))) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { goTo(page + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { goTo(page - 1); e.preventDefault(); }
    else if (e.key === 'Home') { goTo(1); e.preventDefault(); }
    else if (e.key === 'End') { goTo(pageCount()); e.preventDefault(); }
  });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { renderTable(); }, 120);
  });

  /* =====================================================================
     Boot
     ===================================================================== */
  // Tableau always hosts the extension in an iframe. Top-level means someone
  // opened index.html directly, where initializeAsync would hang forever
  // waiting for a host that isn't there.
  var inTableauFrame = window.parent !== window;

  if (!apiReady()) {
    loadDemoData('The Tableau Extensions API did not load. Inside Tableau this ' +
      'means tableau.extensions.1.latest.min.js is missing from the folder ' +
      'next to index.html.');
  } else if (!inTableauFrame) {
    loadDemoData('Opened directly in a browser — no Tableau host to connect to.');
  } else {
    // initializeAsync FIRST — worksheetContent is only populated once the
    // handshake completes, so testing it beforehand always reads as undefined.
    // Raced against a timeout so a stalled handshake reports itself instead of
    // leaving a permanently blank view.
    var handshakeTimeout = new Promise(function (_, reject) {
      setTimeout(function () {
        reject(new Error('Tableau did not finish the extension handshake within ' +
          '15 seconds. If this is Tableau Server or Cloud, check that this URL is ' +
          'allowlisted under Settings \u2192 Extensions with full data access.'));
      }, 15000);
    });

    Promise.race([tableau.extensions.initializeAsync(), handshakeTimeout]).then(function () {
      if (!tableau.extensions.worksheetContent) {
        showError(new Error('This Tableau version does not support viz extensions. ' +
          'Desktop / Server / Cloud 2024.2 or later is required.'));
        return;
      }
      worksheet = tableau.extensions.worksheetContent.worksheet;
      sheetName = worksheet.name || '';
      loadSettings();
      applyTheme();

      worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, function () {
        refreshData();
      });
      tableau.extensions.settings.addEventListener(
        tableau.TableauEventType.SettingsChanged,
        function () {
          loadSettings();
          // Re-resolve the parameter: its name, or the whole date-header
          // feature, may have just changed in the dialog.
          loadAnchorDate().then(function () {
            applyDateHeaders();
            applyFilterAndSort();
            render();
          });
        }
      );

      return loadAnchorDate().then(refreshData);
    }).catch(function (err) {
      console.log('Error initializing: ' + err.toString());
      showError(new Error('initializeAsync failed: ' + (err && err.message ? err.message : err)));
    });
  }
})();
</script>
